services:
  - type: web
    name: ssa-backend
    env: node
    plan: free
    buildCommand: npm install --production=false && npm run build
    startCommand: npm run db:init && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ssa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 1d
      - key: CLOUDINARY_CLOUD_NAME
        value: sbsymyo4
      - key: CLOUDINARY_API_KEY
        value: 421495547388578
      - key: CLOUDINARY_API_SECRET
        value: UMYh-b3HhK521tbFiwtDz1diR8k

databases:
  - name: ssa-db
    plan: free
