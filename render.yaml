services:
  - type: web
    name: ssa-backend
    env: node
    plan: free
    buildCommand: npm install --production=false && npm run build
    startCommand: npm run db:init && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ssa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 1d

databases:
  - name: ssa-db
    plan: free
